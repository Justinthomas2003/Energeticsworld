<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="description" content="Energetics Eco Technologies LLP designs, installs and maintains solar photovoltaic systems for domestic, agricultural and commercial needs across South India." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Energetics World | Pursuit for a green future" />
    <meta property="og:description" content="Solar power systems, solar water pumps and energy efficiency services from Energetics Eco Technologies LLP." />
    <meta property="og:url" content="https://energeticsworld.com/" />
    <link rel="icon" type="image/png" href="/images/logo/energetics-logo.png" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Energetics World | Pursuit for a green future</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('energetics-theme');
        const preferredTheme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = preferredTheme;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
